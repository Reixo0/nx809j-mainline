# Nubia RedMagic 11 Pro (NX809J): two Awinic AW88461 speaker amplifiers on
# primary MI2S (data line SD1), played through MultiMedia2. Left (0x35) is the speaker at the USB port
# end, right (0x34) the one at the other end, in landscape.
#
# The amplifier volume stays at the stock profile level (1023); PipeWire
# scales in software. Headphones play from MultiMedia1 at 32 bit (so low
# volumes keep their resolution), the speakers from MultiMedia2 at 16 bit;
# separate streams, as moving a running stream between backends stalls it.
#
# The bottom microphone is WCD9395 AMIC4. The capture PCM is stereo, so
# decimators 0 and 1 both take it.
#
# The playback and capture routes are set in the verb: PipeWire opens the
# PCMs before it enables a device, and a PCM without a connected backend
# fails to open.
#
# Headphones (3.5 mm jack, WCD9395) play through MultiMedia1, so switching
# outputs never reroutes a running stream. They run in HPH PCM mode, as on
# stock: the
# verb drops the HPH ports and selects PCM mode before any port is
# connected, or a restored mixer state could connect the PDM ports next to
# the PCM one (loud noise).

SectionVerb {
	EnableSequence [
		cset "name='Left Playback Volume' 1023"
		cset "name='Right Playback Volume' 1023"
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia1' off"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia2' off"
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia2' on"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' on"
		cset "name='HPH PCM Switch' off"
		cset "name='HPHL Switch' off"
		cset "name='HPHR Switch' off"
		cset "name='HPHL_COMP Switch' off"
		cset "name='HPHR_COMP Switch' off"
		cset "name='RX_HPH PCM Switch' on"
		cset "name='HPH PCM Switch' on"
		cset "name='RX_HPH PWR Mode' ULP"
		cset "name='RX HPH Mode' CLS_H_ULP"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' on"
	]

	DisableSequence [
		cset "name='PRIMARY_MI2S_RX Audio Mixer MultiMedia2' off"
		cset "name='RX_CODEC_DMA_RX_0 Audio Mixer MultiMedia1' off"
		cset "name='MultiMedia3 Mixer TX_CODEC_DMA_TX_3' off"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker playback"

	Value {
		PlaybackChannels 2
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},1"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	EnableSequence [
		cset "name='RX_MACRO RX0 MUX' AIF1_PB"
		cset "name='RX_MACRO RX1 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT1_1 MIX1 INP0' RX1"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		cset "name='HPHL_RDAC Switch' on"
		cset "name='HPHR_RDAC Switch' on"
		cset "name='HPHL_COMP Switch' on"
		cset "name='HPHR_COMP Switch' on"
		cset "name='HPHL Switch' on"
		cset "name='HPHR Switch' on"
		cset "name='CLSH Switch' on"
		cset "name='HPHL Volume' 16"
		cset "name='HPHR Volume' 16"
	]

	DisableSequence [
		cset "name='HPHL Switch' off"
		cset "name='HPHR Switch' off"
		cset "name='HPHL_COMP Switch' off"
		cset "name='HPHR_COMP Switch' off"
		cset "name='CLSH Switch' off"
	]

	Value {
		PlaybackChannels 2
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		JackControl "Headphone Jack"
		JackHWMute "Speaker"
	}
}

SectionDevice."Mic" {
	Comment "Bottom microphone"

	EnableSequence [
		cset "name='ADC1_MIXER Switch' on"
		cset "name='ADC1 MUX' CH1_AMIC4"
		cset "name='ADC1 Switch' on"
		cset "name='ADC1 Volume' 12"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC0' on"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='TX DEC1 MUX' SWR_MIC"
		cset "name='TX SMIC MUX1' SWR_MIC0"
		cset "name='TX_AIF1_CAP Mixer DEC1' on"
		cset "name='TX_DEC1 Volume' 100"
	]

	DisableSequence [
		cset "name='TX_AIF1_CAP Mixer DEC0' off"
		cset "name='TX_AIF1_CAP Mixer DEC1' off"
		cset "name='ADC1 Switch' off"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
	]

	Value {
		CaptureChannels 2
		CapturePriority 100
		CapturePCM "hw:${CardId},2"
	}
}
