#
# Boot Shim Configs
#
[boot_shim]
requires_kernel_header = true

#
# UEFI FD Configs
#
[uefi_fd]
base = 0xC6900000
size = 0x300000

#
# Android Boot Image Kernel Configs
#
[boot_image_kernel]
kernel_compression = "gzip"
append_dtb         = true

#
# Android Boot Image Configs
#
# The NX809J ABL rejects images without os_version/os_patch_level
# ("Invalid Parameter"); uefi/build.sh also adds the AVB footer.
#
[boot_image]
header_version = 4
os_version     = "16.0.0"
os_patch_level = "2026-08"
