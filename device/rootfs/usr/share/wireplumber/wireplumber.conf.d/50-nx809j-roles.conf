# A volume per kind of sound, as on Android: media, notifications, the
# ringtone, alarms and calls. Each is a virtual sink that streams reach by
# their media.role, in front of whichever output is the default; Denial's
# volume sliders set these sinks and leave the outputs themselves at full.
# Streams without a role count as media. The call sink carries no sound of its
# own (the modem talks to the DSP directly); Denial copies its volume to
# callaudio's.

wireplumber.settings = {
  node.stream.default-media-role = "Multimedia"
}

wireplumber.components = [
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.media"
      node.description = "Media"
      capture.props = {
        media.class = "Audio/Sink"
        audio.position = [ FL, FR ]
        device.intended-roles = [ "Multimedia", "Music", "Movie", "Game", "Production", "Accessibility", "Test" ]
        policy.role-based.priority = 10
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
      playback.props = {
        audio.position = [ FL, FR ]
        node.passive = true
        # A role no sink takes, so the default role doesn't send this sink's
        # sound into the media one
        media.role = "DSP"
      }
    }
    provides = loopback.sink.role.media
    requires = [ support.client-context ]
  }
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.notification"
      node.description = "Notifications"
      capture.props = {
        media.class = "Audio/Sink"
        audio.position = [ FL, FR ]
        device.intended-roles = [ "Notification", "Event" ]
        policy.role-based.priority = 20
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
      playback.props = {
        audio.position = [ FL, FR ]
        node.passive = true
        # A role no sink takes, so the default role doesn't send this sink's
        # sound into the media one
        media.role = "DSP"
      }
    }
    provides = loopback.sink.role.notification
    requires = [ support.client-context ]
  }
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.ringtone"
      node.description = "Ringtone"
      capture.props = {
        media.class = "Audio/Sink"
        audio.position = [ FL, FR ]
        device.intended-roles = [ "Ringtone" ]
        policy.role-based.priority = 30
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
      playback.props = {
        audio.position = [ FL, FR ]
        node.passive = true
        # A role no sink takes, so the default role doesn't send this sink's
        # sound into the media one
        media.role = "DSP"
      }
    }
    provides = loopback.sink.role.ringtone
    requires = [ support.client-context ]
  }
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.alarm"
      node.description = "Alarms"
      capture.props = {
        media.class = "Audio/Sink"
        audio.position = [ FL, FR ]
        device.intended-roles = [ "Alarm" ]
        policy.role-based.priority = 40
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
      playback.props = {
        audio.position = [ FL, FR ]
        node.passive = true
        # A role no sink takes, so the default role doesn't send this sink's
        # sound into the media one
        media.role = "DSP"
      }
    }
    provides = loopback.sink.role.alarm
    requires = [ support.client-context ]
  }
  {
    name = libpipewire-module-loopback, type = pw-module-client
    arguments = {
      node.name = "loopback.sink.role.call"
      node.description = "Calls"
      capture.props = {
        media.class = "Audio/Sink"
        audio.position = [ FL, FR ]
        device.intended-roles = [ "Phone", "Communication" ]
        policy.role-based.priority = 50
        policy.role-based.action.same-priority = "mix"
        policy.role-based.action.lower-priority = "mix"
      }
      playback.props = {
        audio.position = [ FL, FR ]
        node.passive = true
        # A role no sink takes, so the default role doesn't send this sink's
        # sound into the media one
        media.role = "DSP"
      }
    }
    provides = loopback.sink.role.call
    requires = [ support.client-context ]
  }
  {
    type = virtual, provides = custom.nx809j-roles
    requires = [ loopback.sink.role.media, loopback.sink.role.notification,
                 loopback.sink.role.ringtone, loopback.sink.role.alarm,
                 loopback.sink.role.call ]
  }
]

wireplumber.profiles = {
  main = {
    custom.nx809j-roles = required
  }
}
