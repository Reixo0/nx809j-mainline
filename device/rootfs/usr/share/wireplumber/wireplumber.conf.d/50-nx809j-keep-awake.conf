# Outputs that are slow to come back stay awake longer than the default
# 5 seconds of silence. A suspended Bluetooth output releases its audio link,
# which takes a second or two to set up again; a TV on the USB-C display port
# drops the start of the sound while it locks onto the audio again.

monitor.bluez.rules = [
  {
    matches = [ { node.name = "~bluez_output.*" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 120 } }
  }
]

monitor.alsa.rules = [
  {
    # The display port: the phone is usually docked and charging then.
    matches = [ { node.name = "alsa_output.platform-sound.HiFi__HDMI__sink" } ]
    actions = { update-props = { session.suspend-timeout-seconds = 0 } }
  }
]
