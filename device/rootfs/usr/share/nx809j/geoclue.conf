# geoclue reads nx809j-gnss's NMEA (linked into /etc/geoclue/conf.d by
# tmpfiles.d/nx809j-geoclue.conf)
[network-nmea]
enable=true
nmea-socket=/run/nx809j-gnss/nmea.sock

# Wi-Fi positioning from the networks around, through beaconDB (the open
# successor of Mozilla's location service). geoclue disables its Wi-Fi
# source without a URL and falls back to the IP address, kilometres off.
# Only lookups: nothing is contributed.
[wifi]
enable=true
url=https://api.beacondb.net/v1/geolocate
submit-data=false

# Denial's portal is the session's geoclue agent. Without an agent geoclue
# holds every client back, so Android's location (droidloom-location) and
# desktop apps got none.
[agent]
whitelist=denial-portal
