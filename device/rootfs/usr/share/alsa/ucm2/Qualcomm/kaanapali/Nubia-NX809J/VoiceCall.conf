# Modem calls. The DSP carries the call between the modem and the hardware:
# PCM 13 is the kernel's policy endpoint (playback discarded, capture silent),
# there for the audio server to hold while the call runs. Enabling the Mic
# device asks the kernel to start the voice graphs once the HiFi PCMs are
# closed; disabling it stops them before the routes go.
# PlaybackVolume and CaptureSwitch are for callaudio, which sets them for
# call volume and microphone mute: the card uses software volume, which
# cannot reach speech that never passes through the audio server.

SectionVerb {
	EnableSequence [
		cset "name='Voice Call UCM Switch' 0"
		cset "name='Left Playback Volume' 1023"
		cset "name='Right Playback Volume' 1023"
	]
	DisableSequence [
		cset "name='Voice Call UCM Switch' 0"
	]
	Value {
		TQ "Voice"
		Priority 1000
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"
	# The voice profile plays both AW88461 amplifiers on primary MI2S.
	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},13"
		PlaybackChannels 2
		PlaybackRate 48000
		# 0-5, the stock audio HAL's six levels; 5 is loudest
		PlaybackVolume "name='Voice Call Volume'"
	}
}

SectionDevice."Mic" {
	Comment "Bottom microphone (AMIC4)"
	# The voice profile reads one channel from decimator 0.
	EnableSequence [
		cset "name='ADC1_MIXER Switch' on"
		cset "name='ADC1 MUX' CH1_AMIC4"
		cset "name='ADC1 Switch' on"
		cset "name='ADC1 Volume' 12"
		cset "name='TX0 MODE' ADC_NORMAL"
		cset "name='TX DEC0 MUX' SWR_MIC"
		cset "name='TX SMIC MUX0' SWR_MIC0"
		cset "name='TX_DEC0 Volume' 100"
		cset "name='TX_AIF1_CAP Mixer DEC0' on"
		cset "name='TX_AIF1 Capture Switch' on"
		cset "name='Voice Call UCM Switch' 1"
	]
	DisableSequence [
		# A failed STOP keeps the DSP's ports: stop before the routes go.
		cset "name='Voice Call UCM Switch' 0"
		cset "name='TX_AIF1_CAP Mixer DEC0' off"
		cset "name='ADC1 Switch' off"
		cset "name='ADC1 MUX' CH1_AMIC_DISABLE"
	]
	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},13"
		CaptureChannels 2
		CaptureRate 48000
		CaptureSwitch "name='TX_AIF1 Capture Switch'"
	}
}
