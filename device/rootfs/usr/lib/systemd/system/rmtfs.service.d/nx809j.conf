# NX809J: serve the copies of modemst1/modemst2/fsc/fsg in /var/lib/rmtfs
# (made by nx809j-rmtfs-copies.service), never the phone's partitions, which
# Android owns: no -P. -s starts the modem once rmtfs is ready.
[Unit]
Requires=nx809j-rmtfs-copies.service
After=nx809j-rmtfs-copies.service

[Service]
ExecStart=
ExecStart=/usr/bin/rmtfs -s -o /var/lib/rmtfs
