# The display driver (msm) is a module, loaded about 3.5 s into boot. Its
# console takeover a moment later throws a session that already holds the
# VT off it, and SDDM gives up. Wait until msm's framebuffer has taken over
# (at most 10 s; then start anyway, e.g. on the boot framebuffer).
[Service]
ExecStartPre=/bin/sh -c 'for i in $(seq 100); do grep -qs msmdrmfb /sys/class/graphics/fb0/name && exit 0; sleep 0.1; done; exit 0'
