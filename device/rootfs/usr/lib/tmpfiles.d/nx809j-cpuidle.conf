# Test: keep the CPUs out of their deep idle state (cpu-sleep-0), WFI only.
# Linux reset every few minutes with it, and a crash dump showed a CPU stuck
# as if it never woke; a run without it lasted two hours. Remove this once
# the idle state's fault is found.
w /sys/devices/system/cpu/cpu*/cpuidle/state1/disable - - - - 1
