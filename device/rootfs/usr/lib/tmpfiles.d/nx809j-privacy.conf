# nx809j-privacy-system's state. Each user's nx809j-privacy copies their
# switches into users/ (sticky: everyone writes only their own file), and
# geoclue reads the location rules made from them.
d /run/nx809j-privacy 0755 root root -
d /run/nx809j-privacy/users 1733 root root -
f /run/nx809j-privacy/geoclue.conf 0644 root root -
L /etc/geoclue/conf.d/95-nx809j-privacy.conf - - - - /run/nx809j-privacy/geoclue.conf
