# Real-time threads run at full CPU frequency by default. Android turns
# this off at boot (init.rc); inside Droidloom it cannot, and with its
# SurfaceFlinger, RenderEngine, audio and Denial threads all real-time,
# every frame pushed the cores to their top clock. During video playback
# this took the small cores from ~1.6 GHz to ~0.8 GHz (as on Android).
kernel.sched_util_clamp_min_rt_default = 0
