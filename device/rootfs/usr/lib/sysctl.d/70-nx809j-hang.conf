# A hung phone panics instead of spinning: the panic shows every CPU's stack
# and the tasks stuck in the kernel, pstore keeps it, and panic=10 on the
# command line reboots. A CPU stuck with interrupts off was otherwise only
# reported every 20 s until the firmware reset the phone into EDL.
kernel.softlockup_panic = 1
-kernel.hardlockup_panic = 1
-kernel.panic_sys_info = all_bt,blocked_tasks
