# A route over a link without carrier is not used: when Wi-Fi loses its access
# point, the kernel drops the radio link at once, but NetworkManager keeps the
# connection (and its default route) for 15 s while it waits for a
# reconnect. Meanwhile traffic went into the dead link, and a phone falling
# asleep in that window left Android offline instead of on mobile data.
# Android drops the Wi-Fi network as soon as the link goes; so does this.
net.ipv4.conf.all.ignore_routes_with_linkdown = 1
net.ipv4.conf.default.ignore_routes_with_linkdown = 1
net.ipv6.conf.all.ignore_routes_with_linkdown = 1
net.ipv6.conf.default.ignore_routes_with_linkdown = 1
