# Keep the Wi-Fi MAC nx809j-wifi-mac.service set from the persist partition
# (the phone's own address, the one routers know). Fedora's default
# (22-wifi-mac-addr.conf, stable-ssid) would replace it with a made-up one;
# the same section name makes this file's value win.
[connection.22-wifi-mac-addr]
wifi.cloned-mac-address=preserve
