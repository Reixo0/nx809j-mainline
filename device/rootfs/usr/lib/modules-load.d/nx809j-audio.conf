# NX809J: the LPASS codec macros and SoundWire controllers behind the
# speaker, headphone and microphone codecs (WCD939x). They are normally
# loaded when their devices announce themselves once the ADSP is up, but on
# some boots that never happened (2026-11-14, kernel #135): no sound card
# ("WCD Playback: codec dai not found"), no speaker or headphones, and
# callaudio timing out. Load them always; until the ADSP is up their drivers
# just wait for it.
snd_soc_lpass_va_macro
snd_soc_lpass_rx_macro
snd_soc_lpass_tx_macro
soundwire_qcom
